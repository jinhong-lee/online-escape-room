<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>아무도 없는 섬</title>
<meta name="description" content="정신을 차려보니, 낯선 배 안이었다. 온라인 방탈출 게임 — 아무도 없는 섬">

<!-- 파비콘 -->
<link rel="icon" type="image/png" sizes="32x32" href="assets/icons/favicon-32.png">
<link rel="icon" type="image/png" sizes="16x16" href="assets/icons/favicon-16.png">
<link rel="apple-touch-icon" sizes="180x180" href="assets/icons/apple-touch-icon.png">

<!-- Open Graph (카카오톡/페이스북 등 링크 공유 미리보기) -->
<meta property="og:type" content="website">
<meta property="og:title" content="아무도 없는 섬 — 온라인 방탈출">
<meta property="og:description" content="정신을 차려보니, 낯선 배 안이었다. 친구와 함께 풀어나가는 온라인 방탈출 게임.">
<meta property="og:image" content="https://jinhong-lee.github.io/online-escape-room/assets/og-image.jpg">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:url" content="https://jinhong-lee.github.io/online-escape-room/">
<meta property="og:locale" content="ko_KR">

<!-- 트위터 카드 -->
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="아무도 없는 섬 — 온라인 방탈출">
<meta name="twitter:description" content="정신을 차려보니, 낯선 배 안이었다.">
<meta name="twitter:image" content="https://jinhong-lee.github.io/online-escape-room/assets/og-image.jpg">

<!-- ⚠️ styles.css / app.js / story-data.js 수정해서 배포할 때마다
     아래 각 태그의 ?v=N 숫자를 1씩 올려주세요.
     GitHub Pages가 파일을 10분간 캐싱해서, 버전 숫자를 안 올리면
     모바일 등에서 방금 고친 내용이 바로 안 보일 수 있습니다. -->

<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css">
<link rel="stylesheet" href="styles.css?v=4">
</head>
<body>

  <!-- ============================================================
       🛠 제작자 전용 디버그 바 (테스트용 — 실제 게임 UI 밖, 화면 최상단 고정)
       내용 다 완성되고 배포할 때는 이 블록 통째로 삭제하면 됩니다.
       ============================================================ -->
  <div id="dev-toolbar">
    <span class="dev-label">🛠 제작자 모드</span>
    <button id="dev-prev" class="dev-btn">◀ 이전 내용</button>
    <button id="dev-next" class="dev-btn">다음 내용 ▶</button>
    <button id="dev-jump-puzzle" class="dev-btn">🧩 문제로</button>
    <button id="dev-restart" class="dev-btn">⟲ 처음으로</button>
    <button id="dev-refresh" class="dev-btn">🔄 새로고침</button>
  </div>

  <div id="phone">

    <!-- 타이틀 화면 -->
    <section id="screen-title" class="screen active">
      <div class="title-wrap">
        <p class="title-eyebrow">ONLINE ESCAPE ROOM</p>
        <h1 class="title-main" id="title-game-name">아무도 없는 섬</h1>
        <p class="title-sub">정신을 차려보니, 낯선 배 안이었다.</p>
      </div>
      <div class="title-buttons">
        <button id="btn-continue" class="btn btn-primary" hidden>이어서 하기</button>
        <button id="btn-start" class="btn btn-primary">시작하기</button>
        <button id="btn-restart-from-title" class="btn btn-ghost" hidden>처음부터 다시 시작</button>
      </div>
    </section>

    <!-- 게임 화면 -->
    <section id="screen-game" class="screen">

      <div id="image-area" class="image-area">
        <div id="bg-layer" class="bg-layer">
          <img id="bg-image" class="bg-image" alt="" hidden>
          <div id="bg-placeholder" class="bg-placeholder"></div>
        </div>
        <div id="hotspot-layer" class="hotspot-layer"></div>
      </div>

      <div id="text-area" class="text-area" tabindex="0" role="button" aria-label="다음 내용 보기">
        <div id="text-content" class="text-content"></div>
        <div id="next-indicator" class="next-indicator" hidden>▼</div>
      </div>

      <!-- 정답 입력/힌트 바 — 항상 화면 맨 아래 고정 -->
      <div id="bottom-bar" class="bottom-bar" hidden>
        <div id="feedback-msg" class="feedback-msg"></div>

        <div id="puzzle-input-controls" class="puzzle-controls" hidden>
          <input id="puzzle-input" type="text" class="puzzle-input" placeholder="정답을 입력하세요" autocomplete="off" autocapitalize="off" spellcheck="false" enterkeyhint="done">
          <button id="btn-submit-answer" class="btn btn-primary btn-small">정답 제출</button>
        </div>

        <div id="puzzle-hotspot-controls" class="puzzle-controls" hidden>
          <button id="btn-hint" class="btn btn-ghost btn-small">💡 힌트</button>
        </div>
      </div>

    </section>

    <!-- 엔딩(막 종료) 화면 -->
    <section id="screen-end" class="screen">
      <div class="title-wrap">
        <p class="title-eyebrow" id="end-eyebrow">2막 끝</p>
        <h1 class="title-main" id="end-title">— 다음 이야기를 기다려주세요 —</h1>
        <p class="title-sub" id="end-sub"></p>
      </div>
      <div class="title-buttons">
        <button id="btn-replay" class="btn btn-primary">처음부터 다시 플레이</button>
      </div>
    </section>

    <!-- 확인 모달 (초기화 등 되돌릴 수 없는 행동 전 확인) -->
    <div id="confirm-modal" class="modal-overlay" hidden>
      <div class="modal-box">
        <p id="confirm-modal-text" class="modal-text"></p>
        <div class="modal-buttons">
          <button id="confirm-modal-cancel" class="btn btn-ghost btn-small">취소</button>
          <button id="confirm-modal-ok" class="btn btn-primary btn-small">처음부터 시작</button>
        </div>
      </div>
    </div>

  </div>

  <script src="js/story-data.js?v=4"></script>
  <script src="js/app.js?v=4"></script>
</body>
</html>
